[package]
name = "native-sketch-gtk"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_5"] }
gtk = { package = "gtk4", version = "=0.11.3", features = ["v4_10"] }
